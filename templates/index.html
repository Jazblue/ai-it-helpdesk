<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI IT Helpdesk Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-fluid vh-100 d-flex flex-column">
        <!-- Header -->
        <header class="header py-3 mb-3">
            <div class="container">
                <h1 class="h3 mb-0">🤖 AI IT Helpdesk Assistant</h1>
                <p class="text-muted small mb-0">Describe your IT problem and I'll help you troubleshoot it step by step.</p>
            </div>
        </header>

        <!-- Chat Container -->
        <div class="flex-grow-1 overflow-hidden">
            <div class="container h-100">
                <div class="card h-100 chat-card">
                    <div class="card-body d-flex flex-column h-100">
                        <!-- Conversation Area -->
                        <div id="conversation" class="flex-grow-1 overflow-auto mb-3">
                            <div class="text-center text-muted py-5">
                                <p>No messages yet. Describe your IT problem to get started.</p>
                            </div>
                        </div>

                        <!-- Typing Indicator -->
                        <div id="typing-indicator" class="d-none mb-2">
                            <div class="d-flex align-items-start">
                                <div class="flex-shrink-0">
                                    <div class="ai-avatar">
                                        <span class="badge bg-secondary">AI</span>
                                    </div>
                                </div>
                                <div class="flex-grow-1 ms-2">
                                    <div class="typing-dots">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <footer class="footer py-3">
            <div class="container">
                <div class="input-group">
                    <input type="text" id="user-input" class="form-control" placeholder="Type your IT problem..." autocomplete="off">
                    <button id="send-btn" class="btn btn-primary" type="button">
                        Send
                    </button>
                    <button id="new-session-btn" class="btn btn-outline-secondary ms-2" type="button">
                        New Session
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Session Report Modal -->
    <div class="modal fade" id="report-modal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">End of Session Report</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="report-content">
                    <!-- Report will be populated dynamically -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
